[project]
name = "Veyr"
format = 3
architecture = "x86_64"
min_python = "3.11"

[paths]
packages = "packages"
profiles = "profiles"
sources = "sources/distfiles"
build = "build"
out = "out"

[host]
required_commands = [
  "python3",
  "gcc",
  "g++",
  "make",
  "gawk",
  "m4",
  "bison",
  "flex",
  "perl",
  "patch",
  "sed",
  "find",
  "tar",
  "cpio",
  "gzip",
  "file",
  "truncate",
  "mkfs.ext4",
  "e2fsck",
  "debugfs",
  "grub2-mkrescue",
  "xorriso",
  "qemu-system-x86_64",
  "sudo",
  "mount",
  "umount",
  "mountpoint",
  "chroot",
  "realpath",
]