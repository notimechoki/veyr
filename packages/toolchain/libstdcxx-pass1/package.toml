[package]
name = "libstdcxx-pass1"
version = "16.1.0"
category = "toolchain"
description = "Temporary target Libstdc++ built after bootstrap Glibc"
dependencies = ["glibc-bootstrap"]
required_commands = ["gcc", "g++", "make"]
outputs = [
  "out/sysroot/usr/lib/libstdc++.so",
  "out/sysroot/tools/x86_64-veyr-linux-gnu/include/c++/16.1.0",
]

[source]
urls = [
  "https://gcc.gnu.org/ftp/gcc/releases/gcc-16.1.0/gcc-16.1.0.tar.xz",
  "https://ftp.gnu.org/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz",
]
archive = "gcc-16.1.0.tar.xz"
sha256 = "50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79"

[build]
script = "build.sh"