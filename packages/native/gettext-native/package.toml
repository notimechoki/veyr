[package]
name = "gettext-native"
version = "1.0"
category = "native-temporary"
description = "Temporary Gettext tools built natively inside Veyr"
dependencies = ["gcc-pass2"]
required_commands = []
outputs = [
  "build/images/base-alpha4/rootfs/usr/bin/msgfmt",
  "build/images/base-alpha4/rootfs/usr/bin/msgmerge",
  "build/images/base-alpha4/rootfs/usr/bin/xgettext",
  "build/images/base-alpha4/rootfs/usr/lib/veyr/native-build/gettext-native.stamp",
]

[source]
urls = [
  "https://ftpmirror.gnu.org/gettext/gettext-1.0.tar.xz",
  "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz",
]
archive = "gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"

[build]
script = "build.sh"
environment = "chroot"