[package]
name = "bison-native"
version = "3.8.2"
category = "native-temporary"
description = "GNU Bison built natively inside Veyr"
dependencies = ["gettext-native"]
required_commands = []
outputs = [
  "build/images/base-alpha4/rootfs/usr/bin/bison",
  "build/images/base-alpha4/rootfs/usr/lib/veyr/native-build/bison-native.stamp",
]

[source]
urls = [
  "https://ftpmirror.gnu.org/bison/bison-3.8.2.tar.xz",
  "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz",
]
archive = "bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

[build]
script = "build.sh"
environment = "chroot"