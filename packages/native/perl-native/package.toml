[package]
name = "perl-native"
version = "5.44.0"
category = "native-temporary"
description = "Perl built natively inside Veyr"
dependencies = ["bison-native"]
required_commands = []
outputs = [
  "build/images/base-alpha4/rootfs/usr/bin/perl",
  "build/images/base-alpha4/rootfs/usr/lib/veyr/native-build/perl-native.stamp",
]

[source]
urls = [
  "https://www.cpan.org/src/5.0/perl-5.44.0.tar.xz",
  "https://cpan.metacpan.org/authors/id/L/LE/LEONT/perl-5.44.0.tar.xz",
]
archive = "perl-5.44.0.tar.xz"
sha256 = "505cf43912e9480495c344c70260452e32aa2a73c546a026b3f100053b23ce91"

[build]
script = "build.sh"
environment = "chroot"