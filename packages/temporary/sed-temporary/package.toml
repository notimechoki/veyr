  "https://ftpmirror.gnu.org/sed/sed-4.10.tar.xz",
  "https://ftp.gnu.org/gnu/sed/sed-4.10.tar.xz",
]
archive = "sed-4.10.tar.xz"
sha256 = "b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7"

[build]
script = "build.sh"
