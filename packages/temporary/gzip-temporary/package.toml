[package]
name = "gzip-temporary"
version = "1.14"
category = "temporary"
description = "GNU Gzip temporary compression tools"
dependencies = ["grep-temporary"]
required_commands = ["make"]
outputs = [
  "out/sysroot/usr/bin/gzip",
]

[source]
urls = [
  "https://ftpmirror.gnu.org/gzip/gzip-1.14.tar.xz",
  "https://ftp.gnu.org/gnu/gzip/gzip-1.14.tar.xz",
]
archive = "gzip-1.14.tar.xz"
sha256 = "01a7b881bd220bfdf615f97b8718f80bdfd3f6add385b993dcf6efd14e8c0ac6"

[build]
script = "build.sh"
