set timeout=5
set default=0

menuentry "Veyr 0.1 alpha.3" {
    linux /boot/vmlinuz console=tty0 loglevel=4 rdinit=/init
    initrd /boot/initramfs.img
}

menuentry "Veyr 0.1 alpha.3 - verbose" {
    linux /boot/vmlinuz console=tty0 loglevel=7 rdinit=/init veyr.debug=1
    initrd /boot/initramfs.img
}