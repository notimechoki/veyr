set timeout=5
set default=0

menuentry "Veyr 0.1 alpha.2" {
    linux /boot/vmlinuz console=tty0 loglevel=4 rdinit=/init
    initrd /boot/initramfs.img
}

menuentry "Veyr 0.1 alpha.2 - verbose" {
    linux /boot/vmlinuz console=tty0 loglevel=7 rdinit=/init
    initrd /boot/initramfs.img
}

menuentry "Veyr 0.1 alpha.2 - static rescue" {
    linux /boot/vmlinuz console=tty0 loglevel=7 rdinit=/rescue-init
    initrd /boot/initramfs.img
}